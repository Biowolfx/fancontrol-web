services:
  fancontrol-agent:
    image: fancontrol-web
    container_name: fancontrol-agent
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    volumes:
      - /sys:/sys:rw
      - /dev:/dev:rw
      - ./data-agent:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - MODE=setup
      - SERVER_URL=ws://192.168.1.100:5059
      - API_TOKEN=your-token-here
      - NODE_ID=server1
      - NODE_NAME=Server 1
